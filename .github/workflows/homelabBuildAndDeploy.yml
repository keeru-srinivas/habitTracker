name: homelabBuildAndDeploy

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - docker/**
      - .github/workflows/homelabBuildAndDeploy.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  HOMELABOPS_REPO: ${{ vars.HOMELABOPS_REPO || 'UttU28/homeLabOps' }}

jobs:
  buildApi:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkoutApp
        uses: actions/checkout@v4

      - name: loginGhcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: buildAndPush
        run: |
          ownerLower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          shortSha="${GITHUB_SHA::7}"
          image="${{ env.REGISTRY }}/${ownerLower}/habit-api"
          docker build -f docker/Dockerfile.api \
            -t "${image}:${shortSha}" -t "${image}:latest" .
          docker push "${image}:${shortSha}"
          docker push "${image}:latest"

  bumpGitOps:
    needs: [buildApi]
    runs-on: self-hosted
    if: github.event_name != 'pull_request'
    steps:
      - name: validateGitOpsToken
        env:
          GIT_TOKEN: ${{ secrets.HOMELABOPS_GIT_TOKEN }}
        run: |
          if [ -z "$GIT_TOKEN" ]; then
            echo "::error::Missing HOMELABOPS_GIT_TOKEN — add it under habitTracker → Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: checkoutHomeLabOps
        env:
          GIT_TOKEN: ${{ secrets.HOMELABOPS_GIT_TOKEN }}
        run: |
          git clone "https://x-access-token:${GIT_TOKEN}@github.com/${{ env.HOMELABOPS_REPO }}.git" homeLabOps

      - name: updateImageTags
        working-directory: homeLabOps
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          ownerLower=$(echo "${IMAGE_OWNER}" | tr '[:upper:]' '[:lower:]')
          shortSha="${GITHUB_SHA::7}"
          kustomization="apps/habitTracker/kustomization.yaml"
          awk -v img="ghcr.io/${ownerLower}/habit-api" -v tag="${shortSha}" '
            $0 ~ "name: " img { inBlock=1 }
            inBlock && $0 ~ /^[[:space:]]*newTag:/ {
              sub(/newTag:.*/, "newTag: " tag)
              inBlock=0
            }
            { print }
          ' "${kustomization}" > "${kustomization}.tmp"
          mv "${kustomization}.tmp" "${kustomization}"
          grep -A1 'name: ghcr.io' "${kustomization}"

      - name: commitAndPush
        working-directory: homeLabOps
        env:
          GIT_TOKEN: ${{ secrets.HOMELABOPS_GIT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GIT_TOKEN}@github.com/${{ env.HOMELABOPS_REPO }}.git"
          git add apps/habitTracker/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No tag changes to commit."
            exit 0
          fi
          git commit -m "chore(habit): bump habit-api to ${GITHUB_SHA::7}"
          git push origin HEAD
