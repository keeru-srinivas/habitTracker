# Habit Tracker — habit.thatinsaneguy.com
# FastAPI serves UI (/, /app), OpenAPI (/docs), REST (/api/*) on one upstream.
# Upstream port **8010** (config.HABITTRACKER_PORT / deploy.sh); deploy.sh rewrites if you change it.
# After install: sudo certbot --nginx -d habit.thatinsaneguy.com

server {
    listen 80;
    listen [::]:80;
    server_name habit.thatinsaneguy.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
